# =============================================================================
# HermesBench configuration — CASE 3B (fixes variant)
# Deployed after A/B flagged no self-improvement (SUR=0.0). Deviates from the
# A2Z spec's strict gates on PURPOSE, per docs review "case3 fix.md":
#   1. hook_timeout_s        -> 120s hard cap + non-fatal hook failures
#   2. hook_tiered           -> 1.0=skills / [0.7,1.0)=memory-only / <0.7=skip
#   3. testing contract      -> standard import template (see contract skill)
#   4. timeout_s             -> 300s hard wall-clock task cap (was 900s)
#   5. inject_skills        -> keyword pre-loading of top-k home skills
# =============================================================================

project:
  name: HermesBench
  dataset: "datasets/benchmark.csv"
  research_question: >-
    Does Hermes Agent demonstrate measurable self-improvement over repeated
    benchmark execution (faster, more accurate, fewer tool calls, fewer
    retries, fewer errors)?

hermes:
  executable: "${LOCALAPPDATA}/hermes/hermes-agent/venv/Scripts/hermes.exe"
  real_home: "${LOCALAPPDATA}/hermes"
  seed_skills: true
  model: ""
  provider: ""
  extra_args: []
  # Fix #4: hard wall-clock task cap (was 900s) to stop 2.2M-token retry loops.
  timeout_s: 300

learning_hook:
  enabled: true
  arm: treatment
  # Fix #2: no blanket tier exclusions - New-tier tasks may persist too.
  exclude_tiers: []

case3:
  enabled: true
  seed_contract_skill: "skills/benchmark_coding_contract.md"
  # Fix #3: the contract skill now embeds the standardized import template.
  contract_template: true
  # Fix #1: hook cap - reflection sessions may not stall rounds.
  hook_timeout_s: 120
  # Fix #2: tiered quality gates.
  hook_tiered: true
  hook_min_score: 1.0
  hook_memory_min_score: 0.7
  require_workdir_diff: true
  prune_failing_skills: true
  adversarial_hook: true
  # Fix #5: keyword skill pre-loading into the task prompt.
  inject_skills:
    enabled: true
    top_k: 3
    max_chars_per_skill: 600
  delta_pass_threshold: 0.05
  alpha: 0.05

lmstudio:
  base_url: "http://127.0.0.1:1234/v1"
  judge_model: ""
  judge_api_key: "lm-studio"
  judge_timeout_s: 180

benchmark:
  rounds: 5
  arms: ["treatment", "control"]
  task_limit: 10
  pass_threshold: 0.7
  task_timeout_s: 300

log_metrics:
  tool_call_patterns:
    - "tool "
    - " completed ("
    - " returned error ("
    - " cancelled ("
  error_patterns:
    - "ERROR"
    - "Traceback"
    - "Exception"
    - " failed ("
    - " raised for "
    - "Command failed"
    - "exit code"
  retry_patterns:
    - "retry"
    - "Retrying"
    - "max_retries"
  reflection_patterns:
    - "reflection"
    - "Reflecting"
    - "self-critique"
    - "rethink"